name: Android APK — AI MAP VIP PRO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'navigation-map.js'
      - 'live-navigation.js'
      - 'live-navigation.css'
      - 'traffic-intelligence.js'
      - 'tomtom-routing.js'
      - 'traffic-intelligence.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: vip-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub-hosted Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm output exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Map-VIP-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare direct-download APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AI-Map-VIP-Pro-debug.apk
      - name: Publish rolling APK download via GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "A newer commit is on main. Skipping stale release publication."
            exit 0
          fi
          TAG="vip-debug-latest"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AI MAP VIP PRO | Android debug APK" --notes "Android debug APK for sideload testing. Source: GitHub Actions. This is not a signed production release. If an earlier debug APK was built with another signing key, uninstall it before installing this build (local app data will be lost)." --prerelease --latest=false
          fi
          gh release upload "$TAG" ./AI-Map-VIP-Pro-debug.apk --clobber
