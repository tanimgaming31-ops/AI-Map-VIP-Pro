name: Validate and Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML and JavaScript
        run: python3 scripts/check_html.py
      - name: Create ZIP download
        run: zip -r AI-Map-VIP-Pro.zip index.html README.md THIRD_PARTY_NOTICES.md .nojekyll .github/workflows/validate-and-package.yml scripts/check_html.py
      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Map-VIP-Pro
          path: AI-Map-VIP-Pro.zip
          if-no-files-found: error
