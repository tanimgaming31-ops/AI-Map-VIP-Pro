plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tanimboss.aimapvippro'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tanimboss.aimapvippro'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'manifest.webmanifest', 'sw.js', 'icons/**'
    }
    into(layout.projectDirectory.dir('src/main/assets/web'))
}
tasks.named('preBuild') { dependsOn(tasks.named('syncWebAssets')) }
